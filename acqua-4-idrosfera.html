<body>

function renderSheet(S0,k){k=k||1;const g=pg,f=n=>Math.round(n*k),Lh=n=>Math.round(n*k*1.3);g.setTransform(2,0,0,2,0,0);g.fillStyle='#fbfaf6';g.fillRect(0,0,880,1224);

 S0.blocks.forEach(b=>{
  if(b[0]==='h'){y+=f(12);g.fillStyle=RED;g.font='600 '+f(20)+'px '+F;g.fillText(b[1],70,y+f(8));y+=f(40)}
  else if(b[0]==='p'){g.fillStyle=INK;g.font=f(30)+'px '+F;y=wrap(g,b[1],70,y,740,Lh(30))+f(6)}

 });
 if(y>980&&k>.6){renderSheet(S0,k*.94);return}
 sheetFoot(S0)}
function sheetFoot(S0){const g=pg;g.strokeStyle='#b8b5ac';g.lineWidth=2;g.beginPath();g.moveTo(70,1000);g.lineTo(810,1000);g.stroke();
 g.fillStyle=RED;g.font='600 20px '+F;g.fillText(S0.cl,70,1040);g.fillStyle=INK;
 if(S0.bot)S0.bot(g);else if(sel<0){g.font='italic 30px '+F;wrap(g,S0.hint,70,1092,740,38)}
 else{g.font='bold 30px '+F;g.fillText(CAP[sel][0],70,1088);g.font='27px '+F;wrap(g,CAP[sel][1],70,1126,740,35)}
 if(vis.size===N&&flap){g.save();g.translate(730,120);g.rotate(-.25);g.strokeStyle=g.fillStyle='rgba(181,72,58,.88)';g.lineWidth=5;g.beginPath();g.arc(0,0,64,0,7);g.stroke();g.lineWidth=2;g.beginPath();g.arc(0,0,54,0,7);g.stroke();g.textAlign='center';g.font='bold 22px '+F;g.fillText(S0.stamp,0,-6);g.font='bold 34px '+F;g.fillText('✓',0,32);g.restore()}
 g.save();g.textAlign='left';g.fillStyle='#2f353b';{const T='Materiale didattico biennio tecnico - Istituto Majorana-Giorgi - Prof. Sara Piano';let fs=22;g.font='italic '+fs+'px '+F;while(g.measureText(T).width>740&&fs>12){fs--;g.font='italic '+fs+'px '+F}g.fillText(T,70,52)}g.restore();pt.needsUpdate=true}
/* post-it */
const[ic,ig]=cvs(1024,1024),it=new THREE.CanvasTexture(ic),sm=new THREE.MeshStandardMaterial({color:0xe9d35a,roughness:.9});it.anisotropy=AN;
const PI=new THREE.Mesh(new THREE.BoxGeometry(1.9,.02,1.9),[sm,sm,new THREE.MeshStandardMaterial({map:it,roughness:.9}),sm,sm,sm]);PI.position.set(PIX,.011,PIZ);PI.rotation.y=-.08;PI.castShadow=PI.receiveShadow=true;PI.userData.pi=true;S.add(PI);
function drawPI(){const g=ig,H='"Trebuchet MS","Segoe UI",Arial,sans-serif';g.setTransform(2,0,0,2,0,0);g.fillStyle='#f6e36a';g.fillRect(0,0,512,512);g.fillStyle='rgba(0,0,0,.07)';g.fillRect(0,0,512,36);g.fillStyle='#1f1805';
 if(flap){g.font='bold 40px '+H;g.fillText('Risposta',32,96);g.font='bold 31px '+H;wrap(g,PIA,32,146,448,40)}
 else{g.font='bold 66px '+H;g.fillText('Perché?',32,130);g.font='bold 34px '+H;wrap(g,'Prima fai la tua previsione, poi tocca il post-it.',32,200,448,44)}

const OL=new THREE.MeshBasicMaterial({color:0x14283c,side:THREE.BackSide}),PK=[],UPD=[],ITEMS=[];

function h2o(sc){sc=sc||1;const g=new THREE.Group();g.add(ball(.17*sc,0xd1495b));[-1,1].forEach(s=>{const h=ball(.1*sc,0xf3f1ea);h.position.set(s*.19*sc,-.147*sc,0);g.add(h)});return g}
function tape(s,x,z,ang,col,w){w=w||1.5;const L=s.split('|'),n=L.length,hp=n===1?160:100+n*70,[c,g]=cvs(512,hp),H='"Segoe Print","Bradley Hand","Comic Sans MS","Trebuchet MS",cursive';
 g.beginPath();g.moveTo(14,10);g.lineTo(498,10);for(let y=32,k=0;y<hp-12;y+=22,k++)g.lineTo(k%2?498:506,y);g.lineTo(498,hp-10);g.lineTo(14,hp-10);for(let y=hp-32,k=0;y>12;y-=22,k++)g.lineTo(k%2?14:6,y);g.closePath();
 g.fillStyle=col;g.fill();g.save();g.clip();for(let i=0;i<900;i++){g.fillStyle='rgba('+(Math.random()<.5?'120,100,60':'255,255,255')+','+(.04+Math.random()*.08)+')';g.fillRect(Math.random()*512,Math.random()*hp,1+Math.random()*3,1)}
 g.fillStyle='rgba(255,255,255,.18)';g.fillRect(0,18,512,22);g.restore();
 g.textAlign='center';g.fillStyle='#18203a';L.forEach((t,i)=>{let fs=n===1?84:i?52:76;g.font='bold '+fs+'px '+H;while(g.measureText(t).width>410&&fs>24){fs-=2;g.font='bold '+fs+'px '+H}g.fillText(t,256,n===1?104:34+(hp-48)*(i+.78)/n)});
 const tx=new THREE.CanvasTexture(c);tx.anisotropy=AN;const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w*hp/512),new THREE.MeshStandardMaterial({map:tx,transparent:true,roughness:.95,depthWrite:false}));m.rotation.set(-Math.PI/2,0,ang||0);m.position.set(x,.012,z);m.receiveShadow=true;m.renderOrder=3;S.add(m);return m}
const TB='rgba(166,216,212,.96)',TY='rgba(242,212,138,.96)',TP_='rgba(241,169,176,.96)',TL='rgba(196,182,236,.96)',TG='rgba(176,222,160,.96)';
const GL=new THREE.MeshPhysicalMaterial({color:0xe8f4f6,transparent:true,opacity:.28,roughness:.05,clearcoat:1,clearcoatRoughness:.05,side:THREE.DoubleSide,depthWrite:false});
const MS=(c,o,r)=>new THREE.MeshStandardMaterial({color:c,transparent:o!==undefined&&o<1,opacity:o===undefined?1:o,roughness:r===undefined?.7:r});
function bx(w,h,d,c,x,y,z,p,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),(c&&c.isMaterial)?c:MS(c,o));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||S).add(m);return m}

function pipe(a,b,r,c,p){a=new THREE.Vector3(...a);b=new THREE.Vector3(...b);const d=b.clone().sub(a),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),14),(c&&c.isMaterial)?c:MS(c,1,.5));m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=true;(p||S).add(m);return m}
let sd=11;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
function tagItem(root,i){root.traverse(o=>{if(o.isMesh){o.userData.gi=i;PK.push(o)}})}
function item(g,i,o){o=o||{};tagItem(g,i);g.userData.it={i:i,y:g.position.y,s:g.scale.x,lift:o.lift===undefined?.18:o.lift,grow:o.grow===undefined?1.12:o.grow,spin:o.spin||0,glow:o.glow||null};ITEMS.push(g)}
function swarmM(g,n,spd,inb,init,sc){const a=[];for(let i=0;i<n;i++){const m=h2o(sc||.7);m.position.copy(init());m.userData.v=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).setLength(spd);m.userData.w=new THREE.Vector3(rnd()-.5,rnd()-.5,rnd()-.5).multiplyScalar(spd*3+.5);m.rotation.set(rnd()*6,rnd()*6,rnd()*6);g.add(m);a.push(m)}
 UPD.push(dt=>{a.forEach(m=>{const v=m.userData.v,w=m.userData.w;v.x+=(rnd()-.5)*spd*3*dt;v.y+=(rnd()-.5)*spd*3*dt;v.z+=(rnd()-.5)*spd*3*dt;v.setLength(spd);m.position.addScaledVector(v,dt);m.rotation.x+=w.x*dt;m.rotation.y+=w.y*dt;m.rotation.z+=w.z*dt;inb(m.position,v)})})}
const TS=.3;
function grid(x0,z0,cats,cols){for(let n=0;n<100;n++){const r=Math.floor(n/10),c=n%10;let ci=0;for(let k=0;k<cats.length;k++){if(n<cats[k][0]){ci=k;break}}
 const g=new THREE.Group();g.position.set(x0+c*TS,.06,z0+r*TS);const m=new THREE.Mesh(new THREE.BoxGeometry(TS*.9,.12,TS*.9),new THREE.MeshStandardMaterial({color:cats[ci][1],roughness:.6}));m.castShadow=m.receiveShadow=true;g.add(m);S.add(g);item(g,cats[ci][2],{lift:.18,grow:1})}}
/* 1. tutta l'acqua: 97 salata, 3 dolce */
grid(.05,-1.9,[[97,0x2a6fb0,0],[100,0x8fe3f0,1]]);
/* 2. acqua dolce: 69 ghiaccio, 30 falde, 1 superficiale */
grid(4.05,-1.9,[[69,0xdcebf6,2],[99,0x5f9fb0,3],[100,0x2dc4a0,4]]);
tape('Tutta l’acqua|della Terra',1.4,-2.6,.02,TY,1.7);
tape('Solo l’acqua dolce|il 3% del totale',5.4,-2.6,-.02,TY,1.9);
tape('Mari e oceani|97%',1.2,-.3,-.03,TB,1.6).position.y=.14;
tape('Acqua dolce|3%',2.5,1.35,.03,TG,1.3);
tape('zoom|sul 3%',3.55,.7,.04,TP_,1.0);
tape('Ghiacciai e calotte|69%',5.4,-.55,-.03,TB,1.9).position.y=.14;

/* camera e interazione */
let yaw=0,pit=1.1,zm=1,focus=0,fz=0;const TP=new THREE.Vector3(-3.9,.3,.4);
function cam(){const a=innerWidth/innerHeight,d1=Math.max(CAMP.dmin,CAMP.w/(.364*a)),d2=1.12*Math.max(3.3/.364,2.5/(.364*a));fz+=(focus-fz)*.08;const d=(d1+(d2-d1)*fz)*zm,t=CAMP.ta.clone().lerp(TP,fz);C.position.set(t.x+d*Math.sin(yaw)*Math.cos(pit),t.y+d*Math.sin(pit),t.z+d*Math.cos(yaw)*Math.cos(pit));C.lookAt(t)}
$('#fc').onclick=()=>{focus=focus?0:1;$('#fc').textContent=focus?'Vista d’insieme':'Leggi il foglio'};

if(typeof upd==='undefined'){var upd=function(){$('#pr').textContent=vis.size+'/'+N+' '+PRL+(flap?' · post-it aperto':'');drawP();drawPI()}}
const RC=new THREE.Raycaster();
function pick(e){RC.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),C);const h=RC.intersectObjects(PK.concat([PI]),false)[0];if(!h)return;
 if(h.object.userData.gi!==undefined){sel=h.object.userData.gi;vis.add(sel)}else if(h.object.userData.pi)flap=!flap;
 upd()}
let dn=null,dr=false;const el=R.domElement;
el.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY};dr=false;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(!dr&&Math.hypot(dx,dy)>6)dr=true;if(dr){yaw=Math.max(-.7,Math.min(.7,yaw-dx*.005));pit=Math.max(.6,Math.min(1.4,pit+dy*.004));dn={x:e.clientX,y:e.clientY}}});

 const dt=Math.min(.05,t-(frame.p||t));frame.p=t;UPD.forEach(f=>f(dt,t));
 ITEMS.forEach(g=>{const u=g.userData.it,s=u.i===sel,k=u.s*(s?u.grow:1);g.scale.x+=(k-g.scale.x)*.12;g.scale.y=g.scale.z=g.scale.x;g.position.y+=((u.y+(s?u.lift:0))-g.position.y)*.12;if(u.spin)g.rotation.y+=u.spin*(s?3:1)*dt;if(u.glow)u.glow.forEach(m=>m.emissive.setHex(s?0x2a4a6a:0))});
 PI.position.y+=((flap?.3:.011)-PI.position.y)*.15;PI.rotation.x+=((flap?-.15:0)-PI.rotation.x)*.15;
 cam();R.render(S,C)}
drawP();drawPI();rs();addEventListener('resize',rs);requestAnimationFrame(frame);
})();
